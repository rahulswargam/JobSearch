<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Apply Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f9fc; --surface: #ffffff; --surface-2: #eef2f7; --ink: #1b1c1e; --muted: #5d6268; --line: #e1e5eb;
    --blue: #0b57d0; --blue-ink: #ffffff; --blue-soft: #d6e4fd;
    --high: #146c2e; --high-soft: #cdeed6; --high-line: #34a853;
    --med: #8a5300; --med-soft: #ffe7a8; --med-line: #f2a900;
    --glow-a: #c9f0d3; --glow-b: #d6e4fd;
    --shadow: 0 1px 3px rgba(40, 44, 52, .10), 0 6px 16px rgba(40, 44, 52, .06);
    --shadow-hover: 0 6px 14px rgba(40, 44, 52, .14), 0 18px 36px rgba(40, 44, 52, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101113; --surface: #1a1b1e; --surface-2: #25272b; --ink: #e9eaec; --muted: #a7abb1; --line: #313338;
      --blue: #a8c7fa; --blue-ink: #072e6c; --blue-soft: #18325c;
      --high: #74d891; --high-soft: #123a20; --high-line: #3fbf64;
      --med: #ffd56b; --med-soft: #3d2d00; --med-line: #e8a200;
      --glow-a: #10301b; --glow-b: #142849;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5); --shadow-hover: 0 10px 28px rgba(0, 0, 0, .55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101113; --surface: #1a1b1e; --surface-2: #25272b; --ink: #e9eaec; --muted: #a7abb1; --line: #313338;
    --blue: #a8c7fa; --blue-ink: #072e6c; --blue-soft: #18325c;
    --high: #74d891; --high-soft: #123a20; --high-line: #3fbf64;
    --med: #ffd56b; --med-soft: #3d2d00; --med-line: #e8a200;
    --glow-a: #10301b; --glow-b: #142849;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5); --shadow-hover: 0 10px 28px rgba(0, 0, 0, .55);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Google Sans", sans-serif; line-height: 1.45; }
  button, input { font: inherit; color: inherit; }
  a { color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

  /* hero */
  .hero { position: relative; overflow: hidden; padding: 56px 0 28px; }
  .hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; filter: blur(60px); z-index: 0; }
  .hero::before { width: 420px; height: 420px; background: var(--glow-a); top: -200px; left: -120px; }
  .hero::after { width: 380px; height: 380px; background: var(--glow-b); top: -160px; right: -100px; }
  .hero .wrap { position: relative; z-index: 1; }
  .eyebrow { margin: 0 0 10px; font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
  h1 { margin: 0; font-size: clamp(32px, 5vw, 52px); font-weight: 500; line-height: 1.08; letter-spacing: -.02em; max-width: 14ch; }
  .lede { margin: 16px 0 0; max-width: 62ch; color: var(--muted); font-size: 16px; }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 18px; min-width: 120px; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 28px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }
  .stat.high b { color: var(--high); } .stat.medium b { color: var(--med); } .stat.site b, .stat.easy b { color: var(--blue); }

  /* toolbar */
  .bar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-top: 12px; padding-bottom: 12px; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; transition: background .15s, color .15s; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .chip { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--blue-soft); border-color: transparent; color: var(--blue); }
  .search { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-size: 14px; outline: none; }
  .search:focus { border-color: var(--blue); }
  button:focus-visible, a:focus-visible, .search:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* sections */
  section { padding: 28px 0 8px; }
  .sec-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .sec-head h2 { margin: 0; font-size: 22px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
  .sec-head h2::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 0 5px var(--dot-soft); }
  .sec-head p { margin: 0; color: var(--muted); font-size: 14px; }
  section.high { --dot: var(--high-line); --dot-soft: var(--high-soft); }
  section.medium { --dot: var(--med-line); --dot-soft: var(--med-soft); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 16px; }

  /* job card: the whole thing is built around one big button */
  .job { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 20px 18px 14px; background: var(--surface);
         border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); overflow: hidden;
         transition: transform .2s ease, box-shadow .2s ease, opacity .2s; }
  .job::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--accent-line); }
  .job:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
  .job.high { --accent: var(--high); --accent-soft: var(--high-soft); --accent-line: var(--high-line); }
  .job.medium { --accent: var(--med); --accent-soft: var(--med-soft); --accent-line: var(--med-line); }
  .top { display: flex; gap: 12px; align-items: flex-start; position: relative; }
  .avatar { flex: none; width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; font-size: 19px; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
  .who { flex: 1; min-width: 0; }
  .company { font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title { margin: 2px 0 0; font-size: 17px; font-weight: 500; line-height: 1.3; }
  .fit { flex: none; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; position: relative; }
  .meta span { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 3px 10px; }

  .cta { position: relative; display: flex; align-items: center; gap: 12px; margin-top: auto; padding: 10px 10px 10px 20px; border-radius: 999px;
         text-decoration: none; background: var(--blue); color: var(--blue-ink); overflow: hidden; isolation: isolate; transition: box-shadow .2s; }
  .cta::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%);
                transform: translateX(-120%); transition: transform .6s ease; }
  .cta:hover::after { transform: translateX(120%); }
  .cta .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .cta .label { font-size: 15px; font-weight: 500; }
  .cta .sub { font-size: 12px; opacity: .82; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cta .arrow { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.2); transition: transform .25s ease; }
  .cta:hover .arrow { transform: rotate(-45deg) scale(1.06); }
  .cta.easy { background: transparent; color: var(--blue); box-shadow: inset 0 0 0 1.5px var(--blue); }
  .cta.easy .arrow { background: var(--blue-soft); }
  .cta.plain { background: var(--surface-2); color: var(--ink); }
  .cta.plain .arrow { background: var(--surface); }
  .cta.off { background: var(--surface-2); color: var(--muted); }

  .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; position: relative; }
  .foot a { color: var(--muted); text-decoration: none; }
  .foot a:hover { color: var(--ink); text-decoration: underline; }
  .mark { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; transition: background .15s, color .15s; }
  .mark[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .job.done { opacity: .62; }
  .job.done .cta { filter: saturate(.25); }

  /* why this job: matching skills, gaps, one-line reason */
  .skills { display: flex; flex-wrap: wrap; gap: 6px; position: relative; }
  .skills span { font-size: 12px; font-weight: 500; border-radius: 999px; padding: 2px 9px; background: var(--accent-soft); color: var(--accent); }
  .skills span.gap { background: transparent; color: var(--muted); font-weight: 400; box-shadow: inset 0 0 0 1px var(--line); }
  .why { margin: 0; font-size: 13px; color: var(--muted); position: relative;
         display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  footer { padding: 36px 0 48px; color: var(--muted); font-size: 13px; }
  footer p { margin: 0 0 6px; }
  .credit a { color: var(--blue); font-weight: 500; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }

  @media (max-width: 600px) {
    .wrap { padding: 0 16px; }
    .hero { padding-top: 36px; }
    .stat { min-width: 0; flex: 1 1 40%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <p class="eyebrow" id="eyebrow"></p>
    <h1>Apply links, best chances first</h1>
    <p class="lede" id="lede">High-chance roles first, then Medium. Low-chance roles are left out. Where a job links to the company's own careers site, the button goes straight there; otherwise it opens the job board where you apply.</p>
    <div class="stats" id="stats"></div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="seg" role="group" aria-label="Chance">
      <button data-chance="all" aria-pressed="true">All</button>
      <button data-chance="High" aria-pressed="false">High</button>
      <button data-chance="Medium" aria-pressed="false">Medium</button>
    </div>
    <div class="seg" role="group" aria-label="Where you apply">
      <button data-route="all" aria-pressed="true">Any</button>
      <button data-route="company" aria-pressed="false">Company site</button>
      <button data-route="board" aria-pressed="false">Job board</button>
    </div>
    <div class="seg" role="group" aria-label="Source" id="sources" hidden></div>
    <button class="chip" id="hide-done" aria-pressed="false">Hide applied</button>
    <input class="search" id="q" type="search" placeholder="Search company, title, city" aria-label="Search jobs">
  </div>
</div>

<main class="wrap" id="list"></main>
<footer class="wrap">
  <p id="foot"></p>
  <p class="credit">Built by Rahul Swargam · <a href="https://rahulswargam.online/" target="_blank" rel="noopener">Visit my website ↗</a></p>
</footer>

<script>
const DATA = /*DATA*/{};

const store = {
  get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } },
  set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* private window: fine */ } },
};
const applied = new Set(store.get("applied-links") || []);
const state = { chance: "all", route: "all", source: "all", hideDone: false, q: "" };
const SECTIONS = [
  { key: "High", cls: "high", note: "Interview likelihood 65 and up" },
  { key: "Medium", cls: "medium", note: "Interview likelihood 45 to 64" },
];

function el(tag, attrs = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const kid of kids) if (kid) node.append(kid);
  return node;
}

function host(url) {
  try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return url; }
}

function route(job) {
  const src = job.source_label || "LinkedIn";
  if (job.kind === "company" && job.link) return { href: job.link, label: "Apply on company site", sub: host(job.link), cls: "" };
  if (job.kind === "easy") return src === "LinkedIn"
    ? { href: job.url, label: "Easy Apply on LinkedIn", sub: "No company link: applies inside LinkedIn", cls: "easy" }
    : { href: job.url, label: `Apply on ${src}`, sub: `No company link: applies inside ${src}`, cls: "easy" };
  if (job.kind === "closed") return { href: job.url, label: "No longer accepting", sub: `Closed on ${src}`, cls: "off" };
  if (job.kind === "applied") return { href: job.url, label: "Already applied", sub: `On ${src}`, cls: "off" };
  if (job.kind === "company") return { href: job.url, label: `Apply via ${src}`, sub: job.note || `Opens the company site from ${src}`, cls: "plain" };
  return { href: job.url, label: `Open on ${src}`, sub: job.note || host(job.url), cls: "plain" };
}

const ARROW = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

function card(job, cls) {
  const r = route(job);
  const done = applied.has(job.url);
  const city = job.location.split(",").slice(0, 2).join(",");
  const applicants = /^\d+$/.test(job.applicants) ? `${job.applicants} applicants` : job.applicants ? `${job.applicants} applicants` : "";

  const arrow = el("span", { class: "arrow" });
  arrow.innerHTML = ARROW;
  const cta = el("a", { class: `cta ${r.cls}`, href: r.href, target: "_blank", rel: "noopener" },
    el("span", { class: "txt" }, el("span", { class: "label", text: r.label }), el("span", { class: "sub", text: r.sub })),
    arrow);

  const mark = el("button", { class: "mark", "aria-pressed": String(done), text: done ? "Applied ✓" : "Mark applied" });
  const have = (job.skills_match || []).slice(0, 6), gaps = (job.skills_missing || []).slice(0, 3);
  const more = (job.skills_match || []).length - have.length;
  const skills = have.length || gaps.length ? el("div", { class: "skills", title: `You have: ${(job.skills_match || []).join(", ") || "—"}\nBrush up: ${(job.skills_missing || []).join(", ") || "—"}` },
    ...have.map(s => el("span", { text: s })), more > 0 ? el("span", { text: `+${more}` }) : null,
    ...gaps.map(s => el("span", { class: "gap", text: `+ ${s}` }))) : null;
  const why = job.why ? el("p", { class: "why", text: job.why, title: job.why }) : null;
  const also = job.also_on && job.also_on.length ? ` · also on ${job.also_on.join(", ")}` : "";
  const node = el("article", { class: `job ${cls}${done ? " done" : ""}` },
    el("div", { class: "top" },
      el("span", { class: "avatar", text: (job.company.match(/[A-Za-z0-9]/) || ["?"])[0].toUpperCase(), "aria-hidden": "true" }),
      el("div", { class: "who" }, el("div", { class: "company", text: job.company }), el("h3", { class: "title", text: job.title })),
      job.score ? el("span", { class: "fit", text: `Fit ${job.score}`, title: `Resume match ${job.match} · Interview likelihood ${job.likelihood}` }) : null),
    el("div", { class: "meta" },
      ...[city, job.experience && job.experience !== "Not stated" ? job.experience : "", applicants, job.salary, job.posted ? `Posted ${job.posted}` : ""]
        .filter(Boolean).map(t => el("span", { text: t }))),
    skills,
    why,
    cta,
    el("div", { class: "foot" }, el("a", { href: job.url, target: "_blank", rel: "noopener", text: `#${job.rank} · ${job.source_label || "LinkedIn"} post${also}` }), mark));

  mark.addEventListener("click", () => {
    applied.has(job.url) ? applied.delete(job.url) : applied.add(job.url);
    store.set("applied-links", [...applied]);
    render();
  });
  return node;
}

function matches(job) {
  if (state.chance !== "all" && job.chance !== state.chance) return false;
  const onSite = job.kind === "company" && !!job.link;
  if (state.route === "company" && !onSite) return false;
  if (state.route === "board" && onSite) return false;
  if (state.source !== "all" && job.source_label !== state.source) return false;
  if (state.hideDone && applied.has(job.url)) return false;
  if (state.q) {
    const hay = `${job.company} ${job.title} ${job.location} ${job.source_label} ${(job.skills_match || []).join(" ")}`.toLowerCase();
    if (!state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function renderStats() {
  const jobs = DATA.jobs;
  const n = pred => jobs.filter(pred).length;
  const tiles = [
    ["high", n(j => j.chance === "High"), "High chance"],
    ["medium", n(j => j.chance === "Medium"), "Medium chance"],
    ["site", n(j => j.kind === "company" && j.link), "On company sites"],
    ["easy", n(j => !(j.kind === "company" && j.link)), "On job boards"],
    ["", n(j => applied.has(j.url)), "Marked applied"],
  ];
  document.getElementById("stats").replaceChildren(...tiles.map(([cls, num, label]) =>
    el("div", { class: `stat ${cls}` }, el("b", { text: num }), el("span", { text: label }))));
}

function render() {
  renderStats();
  const list = document.getElementById("list");
  const out = [];
  for (const s of SECTIONS) {
    const jobs = DATA.jobs.filter(j => j.chance === s.key && matches(j));
    if (!jobs.length) continue;
    out.push(el("section", { class: s.cls },
      el("div", { class: "sec-head" }, el("h2", { text: `${s.key} chance` }), el("p", { text: `${jobs.length} roles · ${s.note}` })),
      el("div", { class: "grid" }, ...jobs.map(j => card(j, s.cls)))));
  }
  list.replaceChildren(...(out.length ? out : [el("p", { class: "empty", text: "No jobs match these filters." })]));
}

const labels = [...new Set(DATA.jobs.map(j => j.source_label || "LinkedIn"))];
if (labels.length > 1) {
  const seg = document.getElementById("sources");
  seg.append(el("button", { "data-source": "all", "aria-pressed": "true", text: "All sources" }),
    ...labels.map(l => el("button", { "data-source": l, "aria-pressed": "false", text: l })));
  seg.hidden = false;
}

document.querySelectorAll(".seg").forEach(seg => seg.addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
  if (btn.dataset.chance) state.chance = btn.dataset.chance;
  if (btn.dataset.route) state.route = btn.dataset.route;
  if (btn.dataset.source) state.source = btn.dataset.source;
  render();
}));
document.getElementById("hide-done").addEventListener("click", e => {
  state.hideDone = !state.hideDone;
  e.currentTarget.setAttribute("aria-pressed", String(state.hideDone));
  render();
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });

document.getElementById("eyebrow").textContent = `${DATA.jobs.length} roles · from ${DATA.sheet}`;
document.getElementById("foot").textContent = DATA.footer ||
  `Built ${DATA.generated}. "Mark applied" is saved in this browser only.`;
render();
</script>
</body>
</html>
